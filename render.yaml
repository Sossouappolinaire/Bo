services:
  - type: web
    name: koraboost
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: sossoukouam@gmail.com
      - key: ADMIN_PASSWORD
        value: arrow2026
      - key: SEED_TEST_USERS
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SEBPAY_API_URL
        value: https://newapi.sebpay.bj/api/v1
      - key: SEBPAY_PUBLIC_KEY
        sync: false
      - key: SEBPAY_SECRET_KEY
        sync: false
      - key: SEBPAY_CURRENCY
        value: XOF
      - key: SEBPAY_DEFAULT_OPERATOR
        value: mtn-bj
      - key: DATABASE_URL
        fromDatabase:
          name: koraboost-db
          property: connectionString

databases:
  - name: koraboost-db
    plan: free
