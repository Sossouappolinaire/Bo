services:
  - type: web
    name: koraboost
    runtime: node
    plan: free
    buildCommand: npm ci
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SEBPAY_BASE_URL
        value: https://newapi.sebpay.bj
      - key: TASK_REWARD
        value: "3"
      - key: PRICE_PER_INTERACTION
        value: "1"
      - key: MIN_WITHDRAWAL
        value: "300"